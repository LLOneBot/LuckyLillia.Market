name: Register plugin
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 登记 Issue 编号
        required: true
        type: string
permissions: {}
concurrency:
  # Distinct Issues must not share one pending slot: Actions would discard requests.
  group: market-registration-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.body, '### npm 包名')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/register-issue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_ISSUE_NUMBER: ${{ inputs.issue_number }}
          MARKET_AI_ENABLED: ${{ vars.MARKET_AI_ENABLED }}
          MARKET_AI_BASE_URL: ${{ vars.MARKET_AI_BASE_URL }}
          MARKET_AI_MODEL: ${{ vars.MARKET_AI_MODEL }}
          MARKET_AI_MAX_INPUT_BYTES: ${{ vars.MARKET_AI_MAX_INPUT_BYTES }}
          MARKET_AI_API_KEY: ${{ secrets.MARKET_AI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-review
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
