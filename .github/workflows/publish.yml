name: Publish market catalog
on:
  push:
    branches: [main]
    paths: [plugins.json, versions.json]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: market-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always publish current default-branch data, including after a delayed/retried run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm run validate
      - id: release
        run: npm run prepare:release
      - if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
