name: Validate catalog changes
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要检查的 PR 编号
        required: true
        type: string
permissions: {}
concurrency:
  group: market-validate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Privileged workflow: always use trusted default-branch scripts.
      # validate-pr.mjs reads JSON at the pinned PR head SHA via API only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_PR_NUMBER: ${{ inputs.pr_number }}
          MARKET_AI_BASE_URL: ${{ vars.MARKET_AI_BASE_URL }}
          MARKET_AI_MODEL: ${{ vars.MARKET_AI_MODEL }}
          MARKET_AI_MAX_INPUT_BYTES: ${{ vars.MARKET_AI_MAX_INPUT_BYTES }}
          MARKET_AI_MAX_OUTPUT_TOKENS: ${{ vars.MARKET_AI_MAX_OUTPUT_TOKENS }}
          MARKET_AI_API_KEY: ${{ secrets.MARKET_AI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-review
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
