name: Scan plugin versions
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: market-version-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      actions: write
    outputs:
      changed: ${{ steps.scan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scan
        run: node scripts/scan-versions.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_AI_ENABLED: ${{ vars.MARKET_AI_ENABLED }}
          MARKET_AI_BASE_URL: ${{ vars.MARKET_AI_BASE_URL }}
          MARKET_AI_MODEL: ${{ vars.MARKET_AI_MODEL }}
          MARKET_AI_MAX_INPUT_BYTES: ${{ vars.MARKET_AI_MAX_INPUT_BYTES }}
          MARKET_AI_API_KEY: ${{ secrets.MARKET_AI_API_KEY }}
      # Always retry publication. Hash comparison skips already published data.
      # Dispatch keeps the npm trusted-publisher identity fixed at publish.yml.
      - run: node scripts/dispatch-publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-review
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
