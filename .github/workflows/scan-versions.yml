name: Scan plugin versions
on:
  schedule:
    - cron: '17 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions: {}
jobs:
  scan:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.action == 'created' &&
       github.event.issue.state == 'open' &&
       !github.event.issue.pull_request &&
       github.event.issue.user.type == 'Bot' &&
       github.event.issue.user.login == 'github-actions[bot]' &&
       startsWith(github.event.issue.title, '插件更新暂缓：') &&
       startsWith(github.event.issue.body, '<!-- market-review:') &&
       github.event.comment.user.type == 'User')
    # Only eligible jobs queue; different Issues cannot discard each other's retries.
    concurrency:
      group: market-version-scan-${{ github.event.issue.number || 'catalog' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      actions: write
    outputs:
      changed: ${{ steps.scan.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: scan
        run: node scripts/scan-versions.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_AI_BASE_URL: ${{ vars.MARKET_AI_BASE_URL }}
          MARKET_AI_MODEL: ${{ vars.MARKET_AI_MODEL }}
          MARKET_AI_MAX_INPUT_BYTES: ${{ vars.MARKET_AI_MAX_INPUT_BYTES }}
          MARKET_AI_MAX_OUTPUT_TOKENS: ${{ vars.MARKET_AI_MAX_OUTPUT_TOKENS }}
          MARKET_AI_API_KEY: ${{ secrets.MARKET_AI_API_KEY }}
      # Scheduled/manual scans retry publication; comments publish only on changes.
      # Dispatch keeps the npm trusted-publisher identity fixed at publish.yml.
      - run: node scripts/dispatch-publish.mjs
        if: github.event_name != 'issue_comment' || steps.scan.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-review
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
