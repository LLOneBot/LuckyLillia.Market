name: 注册插件
description: 提交 npm 包名、图标和截图声明，由自动化读取插件信息并生成登记 PR。
title: "登记插件："
body:
  - type: markdown
    attributes:
      value: |
        请先将插件公开发布到 npm。
  - type: input
    id: package
    attributes:
      label: npm 包名
      description: 只填写完整包名，不附加版本号。
      placeholder: luckylillia-plugin-example 或 @example/luckylillia-plugin-example
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: icon
      description: 填写包内图片相对路径。
      placeholder: assets/icon.png
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: screenshots
      description: 每行填写一个包内图片相对路径，可填写多张截图。路径和顺序须与已发布版本的 package.json.llbot.screenshots 一致（对象项填写 src）；留空时自动读取。
      placeholder: |
        assets/preview.png
        assets/settings.png
    validations:
      required: false
