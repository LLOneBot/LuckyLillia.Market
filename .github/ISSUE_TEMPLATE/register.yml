name: 注册插件
description: 提交 npm 包名、插件分类、图标和截图声明，由自动化读取插件信息并生成登记 PR。
title: "登记插件："
body:
  - type: markdown
    attributes:
      value: |
        请先将插件公开发布到 npm。
  - type: input
    id: package
    attributes:
      label: npm 包名
      description: 只填写完整包名，不附加版本号。
      placeholder: luckylillia-plugin-example 或 @example/luckylillia-plugin-example
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 插件分类
      description: 按插件主要用途选择，与 Bot 使用相同的分类。
      options:
        - 协议端 (protocol)
        - 适配器 (adapter)
        - 消息互动 (chat)
        - 工具 (tool)
        - 依赖组件 (service)
        - 其他 (other)
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: icon
      description: 填写包内图片相对路径，可为空。
      placeholder: assets/icon.png
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: screenshots
      description: 每行填写一个包内图片相对路径，可填写多张截图，可为空。
      placeholder: |
        assets/preview.png
        assets/settings.png
    validations:
      required: false
